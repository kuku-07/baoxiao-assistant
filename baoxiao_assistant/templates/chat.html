{% from 'nav_macro.html' import nav %}
<!doctype html>
<html><head><meta charset="utf-8"><title>制度查询助手</title>
<style>
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7f5;color:#222}
  .wrap{max-width:900px;margin:24px auto;padding:0 20px}
  .chatbox{background:#fff;border-radius:14px;height:560px;overflow-y:auto;padding:20px;
    box-shadow:0 2px 12px rgba(0,0,0,.05);border:1px solid #eef2ee}
  .bubble{padding:12px 16px;border-radius:14px;margin-bottom:14px;max-width:80%;line-height:1.7;font-size:14px}
  .bubble.u{background:#2E8B57;color:#fff;margin-left:auto;border-bottom-right-radius:4px}
  .bubble.a{background:#f0f6f1;color:#222;border-bottom-left-radius:4px;white-space:pre-wrap}
  .bubble.a code{background:#e2ece6;padding:2px 6px;border-radius:4px;color:#2E8B57}
  .inputrow{display:flex;gap:10px;margin-top:14px}
  .inputrow input{flex:1;padding:12px 16px;border:1px solid #ddd;border-radius:10px;
    font-size:14px;outline:none}
  .inputrow input:focus{border-color:#2E8B57}
  .inputrow button{padding:12px 24px;background:#2E8B57;color:#fff;border:none;
    border-radius:10px;cursor:pointer;font-size:14px;font-weight:600}
  .inputrow button:disabled{background:#aaa}
  .suggest{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
  .suggest button{background:#e8f5ee;color:#2E8B57;border:1px solid #c5e1ce;border-radius:16px;
    padding:6px 14px;font-size:12px;cursor:pointer}
  h3{margin:0 0 10px;font-size:16px;color:#2E8B57}
</style></head><body>
{{ nav('chat', user) }}
<div class="wrap">
  <h3>📖 制度查询助手 · 自主检索 · 按需提问</h3>
  <div class="chatbox" id="chat">
    <div class="bubble a">你好！我是行政专员乔姐维护的<b>制度查询助手</b>🌿\n
你可以用自然语言问我任何关于差旅 / 招待 / 采购的问题，例如：\n
"出差住宿标准是多少？"\n"招待客户需要哪些材料？"</div>
  </div>
  <div class="suggest" id="sug">
    <button onclick="ask('出差住宿标准是多少？')">出差住宿标准</button>
    <button onclick="ask('招待客户需要哪些审批和材料？')">招待审批材料</button>
    <button onclick="ask('坐飞机出差，经济舱还是商务舱？')">交通标准</button>
    <button onclick="ask('采购超过多少钱需要两家报价？')">采购上限</button>
    <button onclick="ask('报销要在出差后多久提交？')">报销时效</button>
  </div>
  <div class="inputrow">
    <input id="q" placeholder="输入你的问题，回车发送..." autofocus>
    <button id="send">发送</button>
  </div>
</div>
<script>
const chat=document.getElementById('chat'), q=document.getElementById('q'), send=document.getElementById('send');
async function ask(text){
  if(!text) return;
  chat.innerHTML += `<div class="bubble u">${text}</div>`;
  q.value=''; send.disabled=true;
  chat.scrollTop=chat.scrollHeight;
  const res=await fetch('/api/policy/query',{
    method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({query:text})
  }).then(x=>x.json());
  chat.innerHTML += `<div class="bubble a">${res.answer}</div>`;
  chat.scrollTop=chat.scrollHeight;
  send.disabled=false;
}
send.onclick=()=>ask(q.value.trim());
q.addEventListener('keydown',e=>{if(e.key==='Enter') ask(q.value.trim())});
</script>
</body></html>
